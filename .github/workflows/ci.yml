# ===========================================================================
# CI — build, test and package every service on every push and pull request.
# ===========================================================================
# Why this file exists, in one sentence: it turns "it worked on my machine"
# into a check that nobody can skip.
#
# The pipeline is deliberately split into jobs that run in PARALLEL, because the
# services are independent — there is no parent aggregator POM, so a product-service
# change has no reason to wait for order-service's tests. That independence is not
# just a build optimisation; it is the practical benefit of microservices, and the
# CI layout is the clearest place to show it.
#
#   backend  (matrix: 5 services, parallel)  ─┐
#   frontend (npm ci && npm run build)         ─┼─> all must pass ─> docker-build
#   structure (onion-rule + secret lint)      ─┘
#
# A red X on a pull request blocks the merge, so a broken service can never reach
# main and therefore can never be deployed.
name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  # Lets you re-run a failed job from the UI without pushing a no-op commit.
  workflow_dispatch:

# Only cancel superseded runs on the same branch. Without `concurrency`, every
# push would queue another full 5-service build and the queue would fall behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # 1. Every Java service: compile, unit test, package.
  # ---------------------------------------------------------------------
  backend:
    name: backend / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Do NOT use fail-fast: one broken service should not cancel the other four.
      # You want the full picture in one run, not "rerun to find the other errors".
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - api-gateway
          - auth-service
          - product-service
          - order-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # Temurin is the Adoptium build of OpenJDK — the reference distribution.
          distribution: temurin
          java-version: '17'

      - name: Cache the Maven repository
        uses: actions/cache@v4
        with:
          # Keyed on the service's pom.xml: changing a dependency invalidates the
          # cache, changing a .java file does not. Without this, every run
          # re-downloads ~200 MB and the pipeline is slow and flaky.
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ matrix.service }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-${{ matrix.service }}-
            ${{ runner.os }}-m2-

      - name: Cache the Maven wrapper
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: ${{ runner.os }}-m2-wrapper-${{ hashFiles('**/mvnw') }}

      - name: Make the Maven wrapper executable
        # The wrapper ships without the exec bit in this repo, so `mvnw verify`
        # fails with EACCES on a fresh checkout.
        run: chmod +x ./mvnw

      - name: Build and test
        # `verify` (not `test`) so the repackaged jar is produced too — that is
        # what the Docker build copies, and catching a packaging failure here is
        # much cheaper than finding it in a deploy.
        run: ./mvnw -B -ntp clean verify

      - name: Upload the packaged jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.service }}/target/*.jar
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # 2. Frontend: install exactly what is locked, then build.
  # ---------------------------------------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install
        # `npm ci`, not `npm install`: ci reads package-lock.json and installs
        # exactly those versions, and FAILS if the lock file is out of sync with
        # package.json. That is the difference between a reproducible build and
        # "works until someone publishes a new patch version".
        run: npm ci

      - name: Build
        # VITE_API_URL is a BUILD-TIME variable in Vite: import.meta.env values are
        # inlined into the bundle by `vite build`, not read at runtime. That means
        # changing the API URL requires a rebuild, not just a restart — a genuinely
        # common source of confusion.
        env:
          VITE_API_URL: https://example-gateway.onrender.com
        run: npm run build

  # ---------------------------------------------------------------------
  # 3. Structural rules: the onion must stay an onion, and no secrets in git.
  # ---------------------------------------------------------------------
  structure:
    name: structure & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enforce the architecture rules
        # Fails the build if anything in a domain/ package imports Spring, JPA,
        # Feign or AWS, or if the application layer imports infrastructure.
        # The dependency rule is only worth anything if it is checked.
        run: node tools/java-lint.mjs .

      - name: Scan for committed secrets
        # A committed DB_PASSWORD or JWT_SECRET is compromised the moment it is
        # pushed, even if the commit is later deleted — git history keeps it. The
        # fix is to rotate the credential, not to remove the line.
        run: |
          echo "::group::Scanning for hard-coded secrets"
          FOUND=0
          # Patterns worth flagging in a Spring/Node repo.
          PATTERNS='(DB_PASSWORD|JWT_SECRET|AWS_SECRET_ACCESS_KEY|VERCEL_TOKEN)\s*[:=]\s*["'"'"']?[A-Za-z0-9/+_.-]{12,}'
          if git grep -nEI "$PATTERNS" -- \
            ':!*.example' ':!*.md' ':!.github/**' ':!render.yaml' ':!frontend/package-lock.json'; then
            echo "::error::A credential-looking value is committed. Rotate it, then use environment variables."
            FOUND=1
          else
            echo "No committed secrets found."
          fi
          echo "::endgroup::"
          exit $FOUND

      - name: Verify render.yaml is valid YAML
        run: |
          python3 -c "
          import sys
          try:
              import yaml
          except ImportError:
              print('PyYAML not available; skipping'); sys.exit(0)
          with open('render.yaml') as f:
              yaml.safe_load(f)
          print('render.yaml parses cleanly')
          "

  # ---------------------------------------------------------------------
  # 4. Docker: prove each service still builds into a runnable image.
  # ---------------------------------------------------------------------
  docker:
    name: docker / ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [backend, structure]
    strategy:
      fail-fast: false
      matrix:
        service: [eureka-server, api-gateway, auth-service, product-service, order-service]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        # No push: this is a smoke test that the Dockerfile and the pom still
        # agree. A broken Dockerfile that compiles locally is a deploy-time
        # surprise, and this job removes that surprise.
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: false
          tags: shopease/${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ===========================================================================
# Publish service images to GitHub Container Registry (GHCR).
# ===========================================================================
# CI proves the images build; this workflow makes them available. The split
# matters: a build failure should be a red X on a PR, and a publish should only
# happen for something already trusted.
#
# WHY A REGISTRY AT ALL when Render builds from source?
#   * reproducible deploys — the exact image that passed CI is what runs;
#   * fast deploys — Render pulls a cached layer instead of running Maven again;
#   * and a rollback is a matter of pointing at the previous tag.
#
# To switch Render over, set each service's Dockerfile to the published image
# and remove the build step (or use a `image:` field instead of `runtime: docker`).
name: Publish images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (defaults to the short SHA)'
        required: false

permissions:
  contents: read
  packages: write          # writing to ghcr.io needs this explicitly

# Never publish two tags to the same tag name concurrently.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [eureka-server, api-gateway, auth-service, product-service, order-service]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is a short-lived, repo-scoped credential. There is no
          # long-lived registry password to store or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=${{ inputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

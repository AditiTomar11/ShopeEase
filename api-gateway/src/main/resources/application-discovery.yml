# ---------------------------------------------------------------------------
# Service-discovery profile:  --spring.profiles.active=discovery
# ---------------------------------------------------------------------------
# The default gateway config routes to hard-coded onrender.com URLs. This
# profile routes through Eureka and Spring Cloud LoadBalancer instead, which is
# how a real microservices deployment works.
#
# ---------------------------------------------------------------------------
# What changes
# ---------------------------------------------------------------------------
#   uri: https://shopeease-product.onrender.com     (default profile)
#   uri: lb://product-service                       (this profile)
#
# `lb://` means: ask Eureka which instances are currently registered under the
# name `product-service`, then round-robin between them. Nothing is hard-coded.
#
# The cost is that the registry becomes a runtime dependency:
#
#   * Eureka itself must be highly available. A single Eureka server is a
#     single point of failure — in production you run a peer cluster so any
#     node can answer for any other (that's what the `eureka.client.service-url`
#     list with several peers is for).
#   * Eureka caches. Spring Cloud's Eureka client keeps a local copy and
#     refreshes it every 30 s, so a newly started instance takes up to 30 s to
#     receive traffic, and a crashed instance keeps receiving it for another 30 s.
#     That is a deliberate trade: fast discovery would make the system fragile to
#     registry blips.
#   * On a free tier, Eureka sleeps like everything else. A cold Eureka plus a
#     cold downstream service is exactly the 1-3 minute cold start described in
#     the README, which is why the default profile pins URLs instead.
#
# Both profiles are valid; the pinned-URL one is chosen for a free-tier demo
# where every cold start is expensive, the discovery one for a real cluster.
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-route
              uri: lb://product-service
              predicates:
                - Path=/products/**
            - id: order-route
              uri: lb://order-service
              predicates:
                - Path=/orders/**
            - id: auth-route
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
      discovery:
        locator:
          # Also expose /product-service/** -> that service, for anything the
          # explicit routes above do not cover.
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: \${EUREKA_URL:http://localhost:8761/eureka}
    # THIS profile genuinely needs the registry: the load balancer resolves
    # lb://product-service from it.
    fetch-registry: true
    registry-fetch-interval-seconds: 30
  instance:
    prefer-ip-address: true
    # Instances renew every 30 s and are evicted after 90 s of silence, so a
    # crashed instance is removed from the registry within ~90 s.
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

server:
  # Render injects PORT (10000 by default); fall back to 8080 locally.
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-route
              uri: https://microservices-demo-product.onrender.com
              predicates:
                - Path=/products/**
            - id: order-route
              uri: https://microservices-demo-order.onrender.com
              predicates:
                - Path=/orders/**
            - id: auth-route
              uri: https://microservices-demo-1-a497.onrender.com
              predicates:
                - Path=/auth/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    # Routes above use direct URLs, not lb://, so the registry is never read here.
    # Skipping the fetch avoids blocking startup on a sleeping Eureka server.
    fetch-registry: false
